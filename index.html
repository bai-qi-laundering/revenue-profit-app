<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d"><meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="儀表板">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>財務儀表板</title><style>:root{--navy:#14213d;--navy2:#1d2f55;--accent:#2a6df4;--bg:#f3f5f9;--card:#fff;--ink:#1c2433;--mut:#6b7585;--line:#e3e7ee;--pos:#12915a;--neg:#d6403f;--warn:#b7791f}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans CJK TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex}
#side{width:208px;flex:none;background:linear-gradient(180deg,var(--navy),#0e1730);color:#cfd8ee;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
#side .brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#side .brand b{display:block;color:#fff;font-size:17px;letter-spacing:1px}#side .brand span{font-size:11px;color:#8fa0c8}
#side nav{padding:10px 8px;flex:1}
#side nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:2px 0;border-radius:8px;cursor:pointer;color:#cfd8ee;user-select:none}
#side nav a:hover{background:rgba(255,255,255,.07)}#side nav a.on{background:var(--accent);color:#fff;font-weight:700}
#side nav a i{font-style:normal;width:20px;text-align:center}
#side .foot{padding:12px 16px;font-size:11px;color:#8fa0c8;border-top:1px solid rgba(255,255,255,.08);line-height:1.6}
#main{flex:1;min-width:0;height:100vh;overflow:auto}
#bar{position:sticky;top:0;z-index:5;background:rgba(243,245,249,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#bar h1{font-size:19px;margin:0 auto 0 0}
.fl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
select,input,button,textarea{font:inherit}
select,input[type=text],input[type=number],input[type=month],input[type=search],textarea{border:1px solid #cfd6e2;border-radius:7px;padding:6px 9px;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:2px solid #b9cdfb;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid #cfd6e2;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--ink)}.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid #cfd6e2;background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}.btn:hover{background:#eef3ff}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{background:#1f5ad6}
.btn.dng{color:var(--neg)}.btn.sm{padding:2px 8px;font-size:12px}
#page{padding:20px 24px 40px;max-width:1500px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
.card{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,33,61,.07);border:1px solid #edf0f5;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--mut);font-size:12px}
.kpi .l{color:var(--mut);font-size:12px}.kpi .v{white-space:nowrap;font-size:21px;font-weight:700;margin:4px 0;letter-spacing:.3px}.kpi .s{font-size:12px;color:var(--mut)}
.kpi{border-left:4px solid var(--accent)}.kpi.g{border-left-color:var(--pos)}.kpi.r{border-left-color:var(--neg)}.kpi.o{border-left-color:#e0a02a}.kpi.p{border-left-color:#7a5af8}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.chk{background:#fff1d6;color:#9a5b00}.tag.ok{background:#dcf5e8;color:#0d7a4a}.tag.man{background:#e6edff;color:#2250c9}.tag.no{background:#fde4e4;color:#b32d2d}.tag.gray{background:#eceff4;color:#566}
.note{background:#eef4ff;border:1px solid #cfe0ff;color:#27406f;border-radius:10px;padding:10px 14px;margin:0 0 14px;line-height:1.7;font-size:13px}
.note.warn{background:#fff7e6;border-color:#ffe0a3;color:#7a4a00}.note.err{background:#fff0f0;border-color:#ffc9c9;color:#8a2222}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#f0f3f9;text-align:left;padding:8px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none;z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th:hover{background:#e6ebf5}td{padding:7px 10px;border-bottom:1px solid #f0f2f6;vertical-align:top}
tr:hover td{background:#f8faff}tfoot td{font-weight:700;background:#f7f9fd;position:sticky;bottom:0}
.tb{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.tb .sp{flex:1}.tb .cnt{color:var(--mut);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
svg.ch{width:100%;height:auto;max-height:400px;display:block}svg text{font-family:inherit;fill:#6b7585;font-size:11px}
.empty{color:var(--mut);padding:30px;text-align:center;background:#fafbfd;border:1px dashed #d5dbe6;border-radius:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}.form input,.form select{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2.sec{font-size:16px;margin:22px 0 10px}
.toast{position:fixed;right:22px;bottom:22px;background:#14213d;color:#fff;padding:10px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50}
@media(max-width:900px){#side{width:62px}#side .brand span,#side nav a span,#side .foot{display:none}#side .brand b{font-size:12px}.g2{grid-template-columns:1fr}}
@media print{#side,#bar{display:none}#main{height:auto}}

#bar #lockbtn{order:99}
@media(max-width:760px){
 body{display:block;font-size:14px}
 #side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.2)}
 #side .brand,#side .foot{display:none}
 #side nav{display:flex;overflow-x:auto;padding:4px;gap:2px;flex:1}
 #side nav a{flex-direction:column;gap:2px;padding:6px 10px;margin:0;font-size:11px;min-width:64px;text-align:center;white-space:nowrap}
 #side nav a span{display:inline!important}
 #main{height:auto;overflow:visible;padding-bottom:84px}
 #bar{padding:8px 12px;gap:8px;top:0}#bar h1{font-size:16px;flex:1 1 60%}
 #page{padding:12px 12px 24px}
 .g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
 .kpi .v{font-size:16px}.card{padding:12px}
 .form{grid-template-columns:1fr 1fr}
 .tw{max-height:420px}
 [style*="grid-template-columns:150px"]{grid-template-columns:90px 1fr 96px 44px!important}
}
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#14213d,#1f3b73);padding:20px}
#lock .box{background:#fff;border-radius:16px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
#lock h1{font-size:20px;margin:6px 0 4px}#lock p{color:#6b7585;margin:0 0 16px;font-size:13px}
#lock .ic{font-size:38px}
#lock input[type=password],#lock input[type=text]{width:100%;padding:11px 12px;font-size:16px;border:1px solid #cfd6e2;border-radius:9px}
#lock .btn{width:100%;margin-top:12px;padding:11px;font-size:15px}
#lock .rm{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:12px;color:#566;margin-top:12px;line-height:1.5}
#lock .err{color:#d6403f;font-size:13px;min-height:18px;margin-top:10px}
#lock .ft{font-size:11px;color:#8a94a6;margin-top:14px;line-height:1.5}
#app{display:contents}#app[hidden],#lock[hidden]{display:none!important}
</style></head><body>
<div id="lock" hidden><div class="box"><div class="ic">🔒</div><h1>財務儀表板</h1><p>資料已加密，請輸入密碼解鎖</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="密碼" autofocus>
<label class="rm"><input type="checkbox" id="show" style="margin-top:2px"> 顯示密碼</label>
<label class="rm"><input type="checkbox" id="rm" style="margin-top:2px"><span>在此裝置記住（會把解密後的資料存在這台裝置的瀏覽器，僅限自己的私人裝置；按「鎖定」即清除）</span></label>
<button class="btn pri" id="go">解鎖</button><div class="err" id="err" role="alert"></div>
<div class="ft">AES-256-GCM 加密，只在此瀏覽器內解密，<br>不會上傳任何資料。</div></div></div>
<div id="app" hidden style="display:contents"><aside id="side"><div class="brand"><b id="brandA"></b><span id="brandB"></span></div><nav id="nav"></nav><div class="foot">NT$ 新台幣<br>資料只在此瀏覽器內<br>不連網、不上傳</div></aside>
<div id="main"><div id="bar"></div><div id="page"></div></div></div>

function load(){try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);ST.entries=o.entries||[];ST.settings=Object.assign(ST.settings,o.settings||{});ST.settings.assign=Object.assign({erp:'',pl115:'',pay:''},ST.settings.assign||{})}}catch(e){memOnly=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){memOnly=true;toast('⚠ 瀏覽器不允許儲存，資料僅保留到關閉視窗為止，請用「匯出備份」')}}
load();
/* ---------- state ---------- */
const S={tab:'overview',co:'全部',year:'全部',gran:'bi',revSrc:'401',costSrc:'auto'};
const TABS=[['overview','總覽','▦'],['revenue','營業額','＄'],['pl','損益表','⇅'],['ledger','分類帳','☰'],['payroll','薪資','♟'],['invoice','發票','▤'],['settings','資料匯入／設定','⚙']];
const coOk=c=>S.co==='全部'||c===S.co;
const yrOk=ym=>S.year==='全部'||String(ym).slice(0,4)===S.year;
const asgOk=k=>S.co==='全部'||ST.settings.assign[k]===S.co;
function years(){const s=new Set();D.r401.forEach(r=>s.add(r.start.slice(0,4)));D.erp.forEach(r=>s.add(r.month.slice(0,4)));D.pl.forEach(r=>s.add(String(r.year)));ST.entries.forEach(e=>s.add(e.ym.slice(0,4)));return[...s].sort()}
function bucket(ym,g){const y=ym.slice(0,4),m=+ym.slice(5,7);if(g==='year')return y;if(g==='month')return ym;const m0=m%2?m:m-1;return y+'-'+pad(m0)+'~'+pad(m0+1)}
const GL={bi:'兩月(對應401申報期)',month:'月',year:'年'};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
/* ---------- csv ---------- */
function csvCell(v){v=v==null?'':String(v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadText(name,text,mime){const b=new Blob(['\ufeff'+text],{type:(mime||'text/csv')+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
/* ---------- charts ---------- */
function nice(min,max,t=5){if(min>0)min=0;if(max<0)max=0;if(max===min)max=min+1;const raw=(max-min)/t,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,step=(f<=1?1:f<=2?2:f<=5?5:10)*p;return{min:Math.floor(min/step+1e-9)*step,max:Math.ceil(max/step-1e-9)*step,step}}
function legend(series){return'<div class="legend">'+series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')+'</div>'}
function xlabels(cats,x0,gw,y,rot){const n=cats.length,k=rot?Math.ceil(n/22):Math.ceil(n/14);return cats.map((c,i)=>{if(i%k)return'';const x=x0+gw*i+gw/2;return rot?`<text transform="translate(${x},${y+10}) rotate(-35)" text-anchor="end">${esc(c)}</text>`:`<text x="${x}" y="${y+16}" text-anchor="middle">${esc(c)}</text>`}).join('')}
function barChart(o){const cats=o.cats,ser=o.series,fv=o.fmtv||short,W=760,H=o.h||290,rot=o.rot||cats.some(c=>String(c).length>9)&&cats.length>3;
 if(!cats.length||!ser.some(s=>s.vals.some(v=>v!=null)))return'<div class="empty">此篩選條件下沒有資料</div>';
 const m={l:58,r:10,t:10,b:rot?(o.botRot||78):26},iw=W-m.l-m.r,ih=H-m.t-m.b;let mn=0,mx=0;
 cats.forEach((_,i)=>{if(o.stacked){let p=0,n=0;ser.forEach(s=>{const v=s.vals[i]||0;v>=0?p+=v:n+=v});mx=Math.max(mx,p);mn=Math.min(mn,n)}else ser.forEach(s=>{const v=s.vals[i];if(v!=null){mx=Math.max(mx,v);mn=Math.min(mn,v)}})});
 const sc=nice(mn,mx),Y=v=>m.t+ih-(v-sc.min)/(sc.max-sc.min)*ih,gw=iw/cats.length;let g='';
 for(let v=sc.min;v<=sc.max+1e-9;v+=sc.step)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${Math.abs(v)<1e-9?'#9aa5b8':'#e8ecf3'}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${fv(v)}</text>`;
 const ns=o.stacked?1:ser.length,bw=Math.min(46,gw*.78/ns);let bars='';
 cats.forEach((c,i)=>{let pp=0,nn=0;ser.forEach((s,j)=>{const v=s.vals[i];if(v==null)return;const x=o.stacked?m.l+gw*i+(gw-bw)/2:m.l+gw*i+(gw-bw*ns)/2+bw*j;let y1,y2;if(o.stacked){if(v>=0){y1=Y(pp+v);y2=Y(pp);pp+=v}else{y1=Y(nn);y2=Y(nn+v);nn+=v}}else{y1=Y(Math.max(v,0));y2=Y(Math.min(v,0))}
  bars+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${Math.max(bw-1,1).toFixed(1)}" height="${Math.max(y2-y1,.5).toFixed(1)}" rx="2" fill="${v<0&&s.negColor?s.negColor:s.color}"><title>${esc(c)}｜${esc(s.name)}：${fv===short?nt(v):fv(v)}</title></rect>`})});
 return(o.noLegend?'':legend(ser))+`<svg class="ch" viewBox="0 0 ${W} ${H}">${g}${bars}${xlabels(cats,m.l,gw,H-m.b,rot)}</svg>`}
function lineChart(o){const cats=o.cats,ser=o.series,fv=o.fmtv||pct,W=760,H=o.h||240,rot=cats.some(c=>String(c).length>9)&&cats.length>3;
 if(!cats.length||!ser.some(s=>s.vals.some(v=>v!=null)))return'<div class="empty">此篩選條件下沒有資料</div>';
 const m={l:58,r:14,t:12,b:rot?78:26},iw=W-m.l-m.r,ih=H-m.t-m.b;let mn=1e18,mx=-1e18;ser.forEach(s=>s.vals.forEach(v=>{if(v!=null){mn=Math.min(mn,v);mx=Math.max(mx,v)}}));
 const sc=nice(Math.min(mn,0),Math.max(mx,0)),Y=v=>m.t+ih-(v-sc.min)/(sc.max-sc.min)*ih,gw=iw/cats.length;let g='';
 for(let v=sc.min;v<=sc.max+1e-9;v+=sc.step)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${Math.abs(v)<1e-9?'#9aa5b8':'#e8ecf3'}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${fv(v)}</text>`;
 let p='';ser.forEach(s=>{let d='',pen=false,dots='';s.vals.forEach((v,i)=>{if(v==null){pen=false;return}const x=m.l+gw*i+gw/2;d+=(pen?'L':'M')+x.toFixed(1)+' '+Y(v).toFixed(1);pen=true;dots+=`<circle cx="${x.toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(cats[i])}｜${esc(s.name)}：${fv(v)}</title></circle>`});p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2"/>${dots}`});
 return(ser.length>1?legend(ser):'')+`<svg class="ch" viewBox="0 0 ${W} ${H}">${g}${p}${xlabels(cats,m.l,gw,H-m.b,rot)}</svg>`}
function hbars(items,opt={}){items=items.filter(i=>i.val);const tot=sum(items.map(i=>Math.abs(i.val)));if(!items.length)return'<div class="empty">沒有可顯示的成本項目</div>';const mx=Math.max(...items.map(i=>Math.abs(i.val)));
 return items.map((i,k)=>`<div style="display:grid;grid-template-columns:150px 1fr 130px 54px;gap:8px;align-items:center;margin:5px 0;font-size:13px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.name)}">${esc(i.name)}</span><span style="background:#eef1f7;border-radius:5px;height:14px"><i style="display:block;height:14px;border-radius:5px;width:${Math.abs(i.val)/mx*100}%;background:${PAL[k%PAL.length]}"></i></span><span style="text-align:right;font-variant-numeric:tabular-nums">${nt(i.val)}</span><span style="color:var(--mut);text-align:right">${pct(Math.abs(i.val)/tot)}</span></div>`).join('')}
/* ---------- table component ---------- */
const TREG={},TS={};
function table(id,cols,rows,opt={}){TREG[id]={cols,rows,opt};TS[id]=TS[id]||{q:'',sk:opt.sort&&opt.sort[0],sd:opt.sort?opt.sort[1]:1};
 return`<div class="tbl" data-t="${id}"><div class="tb">${opt.noSearch?'':`<input type="search" placeholder="搜尋…" value="${esc(TS[id].q)}" data-act="tq" data-id="${id}" style="width:200px">`}<span class="cnt" id="cnt_${id}"></span><span class="sp"></span>${opt.noExport?'':`<button class="btn sm" data-act="texp" data-id="${id}">⬇ 匯出CSV</button>`}</div><div class="tw" style="${opt.maxh?'max-height:'+opt.maxh:''}" id="tw_${id}"></div></div>`}
function tval(c,r){return c.v?c.v(r):r[c.k]}
function tview(id){const {cols,rows}=TREG[id],s=TS[id];let rs=rows;const q=(s.q||'').trim().toLowerCase();
 if(q)rs=rs.filter(r=>cols.some(c=>{const v=tval(c,r);return String(c.t?c.t(r):(v==null?'':v)).toLowerCase().includes(q)||String(v==null?'':v).toLowerCase().includes(q)}));
 if(s.sk){const c=cols.find(c=>c.id===s.sk||c.k===s.sk);if(c){rs=rs.slice().sort((a,b)=>{let x=tval(c,a),y=tval(c,b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'zh-Hant'))*s.sd})}}
 return rs}
function drawTable(id){const el=$('#tw_'+id);if(!el)return;const {cols,opt}=TREG[id],s=TS[id],rs=tview(id);
 const th=cols.map(c=>`<th class="${c.num?'num':''}" data-act="tsort" data-id="${id}" data-k="${c.id||c.k}">${esc(c.l)}${(s.sk===(c.id||c.k))?(s.sd>0?' ▲':' ▼'):''}</th>`).join('');
 const lim=opt.limit||1500;const body=rs.slice(0,lim).map(r=>'<tr>'+cols.map(c=>{const v=tval(c,r);let h=c.h?c.h(r):(c.num?(c.f?c.f(v,r):fmt(v)):(c.f?c.f(v,r):esc(v==null?'':v)));if(c.num&&c.neg&&typeof v==='number')h=`<span class="${v<0?'neg':''}">${h}</span>`;return`<td class="${c.num?'num':''}">${h}</td>`}).join('')+'</tr>').join('');
 const foot=cols.some(c=>c.sum)?'<tfoot><tr>'+cols.map((c,i)=>c.sum?`<td class="num">${(c.f?c.f(sum(rs.map(r=>tval(c,r))),null):fmt(sum(rs.map(r=>tval(c,r)))))}</td>`:`<td>${i===0?'合計':''}</td>`).join('')+'</tr></tfoot>':'';
 el.innerHTML=rs.length?`<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${foot}</table>`:'<div class="empty" style="border:0">沒有符合的資料</div>';
 const ce=$('#cnt_'+id);if(ce)ce.textContent=rs.length+' 筆'+(rs.length<TREG[id].rows.length?`（共 ${TREG[id].rows.length}）`:'')}
function drawTables(){Object.keys(TREG).forEach(id=>{if($('#tw_'+id))drawTable(id)})}
function exportTable(id){const {cols,opt}=TREG[id],rs=tview(id);const lines=[cols.map(c=>csvCell(c.l)).join(',')];rs.forEach(r=>lines.push(cols.map(c=>{let v=c.csv?c.csv(r):tval(c,r);return csvCell(v)}).join(',')));downloadText((opt.name||id)+'_'+new Date().toISOString().slice(0,10)+'.csv',lines.join('\r\n'))}
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;
const CHK=tag('待核對','chk');

/* ---------- data helpers ---------- */
const MONTHS115=['2026-01','2026-02','2026-03','2026-04','2026-05'];
const manual=t=>ST.entries.filter(e=>(Array.isArray(t)?t.includes(e.type):e.type===t)&&coOk(e.co)&&yrOk(e.ym));
function revPoints(ignoreGran){const pts=[];if(ST.settings.use401&&(ignoreGran||S.gran!=='month'))D.r401.forEach(r=>{if(coOk(r.co)&&yrOk(r.start)&&r.sales!=null)pts.push({co:r.co,ym:r.start,val:r.sales,kind:'401申報',ocr:r.ocr})});manual('rev').forEach(e=>pts.push({co:e.co,ym:e.ym,val:e.amt,kind:'手動輸入'}));return pts}
function stackByCo(pts,g){const cats=[...new Set(pts.map(p=>bucket(p.ym,g)))].sort();const cos=[...new Set(pts.map(p=>p.co))];const ser=cos.map(c=>({name:c,color:COL[c]||'#888',vals:cats.map(k=>{const a=pts.filter(p=>p.co===c&&bucket(p.ym,g)===k);return a.length?sum(a.map(p=>p.val)):null})}));return{cats,series:ser}}
function plRows(){return D.pl.filter(r=>coOk(r.co)&&yrOk(r.year))}
function plLabel(r){return r.co+' '+r.per}
function mplRows(){const m={};manual(['rev','cost','pay']).forEach(e=>{const k=e.co+'|'+e.ym;const o=m[k]=m[k]||{co:e.co,ym:e.ym,rev:0,cost:0,pay:0};if(e.type==='rev')o.rev+=e.amt;else if(e.type==='cost')o.cost+=e.amt;else o.pay+=e.amt});return Object.values(m).map(o=>Object.assign(o,{profit:o.rev-o.cost-o.pay,margin:o.rev?(o.rev-o.cost-o.pay)/o.rev:null})).sort((a,b)=>a.ym.localeCompare(b.ym)||a.co.localeCompare(b.co))}
function aggBy(rows,g,keys){const m={};rows.forEach(r=>{const b=bucket(r.ym,g);const o=m[b]=m[b]||Object.fromEntries(keys.map(k=>[k,0]));keys.forEach(k=>o[k]+=r[k]||0)});return Object.keys(m).sort().map(b=>Object.assign({b},m[b]))}
function pl115Rows(){if(!asgOk('pl115')||!(S.year==='全部'||S.year==='2026'))return[];return MONTHS115.map((ym,i)=>{const rev=D.pl115['收入'][i],cost=D.pl115['總支出'][i],pr=D.pl115['淨利'][i];return{ym,rev,cost,profit:pr,margin:rev?pr/rev:null,pay:D.pl115['薪資'][i]}})}
function payRows(){const o=[];if(asgOk('pay'))Object.keys(D.pay).forEach(k=>{if(yrOk(k))o.push({ym:k,src:'薪資表(114年)',n:D.pay[k].n,gross:D.pay[k].gross,net:D.pay[k].net,ins:D.pay[k].ins,base:D.pay[k].base})});return o}
function noAsgMsg(what,key){return`<div class="note warn">${what}的來源檔案<b>未標示是哪一家公司</b>，因此只在公司＝「全部」時顯示。若您確定它屬於某一家公司，可到「資料匯入／設定」→「未標示公司之資料歸屬」指定（目前：${esc(ST.settings.assign[key]||'未指定')}）。</div>`}
/* ---------- filter bar ---------- */
function bar(){const t=TABS.find(x=>x[0]===S.tab);const ys=['全部',...years()];
 const showG=['overview','revenue','pl','payroll','invoice'].includes(S.tab);
 return`<h1>${t[2]} ${t[1]}</h1><button class="btn sm" data-act="lock" title="鎖定並清除記憶體中的資料" id="lockbtn">🔒 鎖定</button><label class="fl">公司 <select data-act="co">${['全部',...D.cos].map(c=>`<option ${c===S.co?'selected':''}>${c}</option>`).join('')}</select></label><label class="fl">年度 <select data-act="year">${ys.map(c=>`<option ${c===S.year?'selected':''}>${c}</option>`).join('')}</select></label>${showG?`<span class="fl">期間 <span class="seg">${[['bi','兩月'],['month','月'],['year','年']].map(([k,l])=>`<button data-act="gran" data-v="${k}" class="${S.gran===k?'on':''}">${l}</button>`).join('')}</span></span>`:''}`}
function granNote(){return S.gran==='month'?'<div class="note warn">「月」視圖：401 申報書是<b>兩個月一期</b>，無法拆成單月，因此月視圖不顯示 401 數字（僅顯示月資料：手動輸入、ERP、薪資表、管理帳）。要看 401 請切換到「兩月」或「年」。</div>':''}
/* ---------- overview ---------- */
function pageOverview(){
 const pts=revPoints(true),p401=pts.filter(p=>p.kind==='401申報'),pm=pts.filter(p=>p.kind==='手動輸入');
 const mr=sum(manual('rev').map(e=>e.amt)),mc=sum(manual('cost').map(e=>e.amt)),mp=sum(manual('pay').map(e=>e.amt));
 const erp=asgOk('erp')?D.erp.filter(r=>yrOk(r.month)):[];const p115=pl115Rows(),pay=payRows();
 const last=p401.slice().sort((a,b)=>b.ym.localeCompare(a.ym))[0];
 const lastR=last&&D.r401.find(r=>r.start===last.ym&&r.co===last.co);
 const nocr=p401.filter(p=>p.ocr).length;
 const kp=(l,v,s,c='')=>`<div class="card kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
 let k='';
 k+=kp('申報營業額（401銷售額合計）',nt(sum(p401.map(p=>p.val))),`${p401.length} 期${nocr?`，其中 ${nocr} 期為 OCR ${CHK}`:''}`);
 k+=kp('最近一期申報營業額',last?nt(last.val):'—',last?`${last.co}｜${last.ym}${lastR&&lastR.ocr?' ':''}`:'無資料','p');
 k+=kp('ERP 銷貨額（未稅）',asgOk('erp')?nt(sum(erp.map(r=>r.sales_pretax))):'—',asgOk('erp')?`${erp.length} 個月｜來源：ERP資料庫`:'ERP 未標示公司，僅「全部」顯示','g');
 k+=kp('管理帳淨利（115年1–5月）',p115.length?nt(sum(p115.map(r=>r.profit))):'—',p115.length?`收入 ${nt(sum(p115.map(r=>r.rev)))}`:'管理帳未標示公司，僅「全部」顯示','o');
 k+=kp('薪資總額（114年，應發）',pay.length?nt(sum(pay.map(r=>r.gross))):'—',pay.length?`${pay.length} 個月彙總｜不含個人明細`:'薪資表未標示公司，僅「全部」顯示','p');
 k+=kp('手動輸入：營收',nt(mr),`${manual('rev').length} 筆`,'');
 k+=kp('手動輸入：成本＋薪資',nt(mc+mp),`成本 ${nt(mc)}／薪資 ${nt(mp)}`,'r');
 k+=kp('手動輸入：利潤（營收−成本−薪資）',`<span class="${mr-mc-mp<0?'neg':'pos'}">${nt(mr-mc-mp)}</span>`,`利潤率 ${pct(mr?(mr-mc-mp)/mr:null)}`,'g');
 const tr=stackByCo(pts,S.gran);
 const rows=plRows().filter(r=>r.rev!=null||r.cost!=null||r.profit!=null);
 return granNote()+`<div class="grid g4">${k}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>營業額趨勢 <small>${GL[S.gran]}｜401申報＋手動輸入｜NT$</small></h3>${barChart({cats:tr.cats,series:tr.series,stacked:true})}</div>
 <div class="card"><h3>營收／成本／利潤 對照 <small>年度與暫結損益表，NT$</small></h3>${plChart(rows)}</div>
 <div class="card"><h3>利潤率 <small>損益 ÷ 營業收入（僅列兩者皆有的資料）</small></h3>${marginChart(rows)}</div>
 <div class="card"><h3>成本結構 ${costSel()}</h3>${costBody()}</div></div>
 <h2 class="sec">資料涵蓋情形</h2><div class="card">${coverage()}</div>`}

 h+=`<div class="grid g2" style="margin-top:14px"><div class="card"><h3>匯入 CSV／Excel</h3><div style="font-size:13px;line-height:1.7;color:#394559">欄位標題（第一列）可用：<b>類型、公司、月份、類別、金額、稅額、發票號碼、備註</b>。<br>類型填：營收、成本、薪資、銷項發票、進項發票。月份例：2026-03、2026/3、115/03。</div>

 ${memOnly?'<div class="note err" style="margin-top:10px">⚠ 此瀏覽器模式無法永久儲存，請務必匯出備份。</div>':''}</div></div>`;
 const asg=k=>`<select data-act="assign" data-k="${k}"><option value="">不指定（僅「全部」顯示）</option>${D.cos.map(c=>`<option ${ST.settings.assign[k]===c?'selected':''}>${c}</option>`).join('')}</select>`;
 h+=`<div class="card" style="margin-top:14px"><h3>設定</h3><div class="grid g2" style="gap:10px"><label><input type="checkbox" data-act="use401" ${ST.settings.use401?'checked':''}> 營業額／發票納入內建 401 申報資料（取消＝只看手動輸入；可避免與手動資料重複計算）</label><div></div>
 <div><b>未標示公司之資料歸屬</b><div style="font-size:12px;color:var(--mut);margin:4px 0">這三份資料在原檔中看不出是哪一家公司，所以我沒有擅自指定：</div>
 <div class="form" style="grid-template-columns:repeat(3,1fr)"><label>ERP 銷貨${asg('erp')}</label><label>115年管理帳${asg('pl115')}</label><label>114年薪資表${asg('pay')}</label></div></div></div>

/* ---------- import logic ---------- */
function normCo(s){s=String(s||'').trim();if(!s)return'';for(const c of D.cos)if(s===c)return c;for(const [k,v] of D.ui.alias)if(s.includes(k))return v;return''}
function normType(s){s=String(s||'').trim();if(/銷項/.test(s))return'inv_out';if(/進項/.test(s))return'inv_in';if(/薪|人事/.test(s))return'pay';if(/營收|營業額|收入|銷貨|銷售/.test(s))return'rev';if(/成本|費用|支出|進貨/.test(s))return'cost';return''}
function normYM(v){if(v==null||v==='')return'';if(v instanceof Date)return v.getFullYear()+'-'+pad(v.getMonth()+1);if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)}
 const s=String(v).trim();let m=s.match(/^(\d{4})\D?(\d{1,2})/);if(m&&+m[2]>=1&&+m[2]<=12)return m[1]+'-'+pad(+m[2]);m=s.match(/^(\d{2,3})\s*[\/.\-年]\s*(\d{1,2})/);if(m&&+m[1]<200&&+m[2]>=1&&+m[2]<=12)return(+m[1]+1911)+'-'+pad(+m[2]);return''}
function normAmt(v){if(typeof v==='number')return v;let s=String(v==null?'':v).replace(/[,\s]|NT\$|\$|元/gi,'');if(!s)return null;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}const n=Number(s);return isNaN(n)?null:(neg?-n:n)}
const HD={type:/類型|類別型|type/i,co:/公司|company/i,ym:/月份|日期|期間|date|month|ym/i,cat:/^(類別|科目|分類|category)$/i,amt:/金額|amount/i,tax:/稅額|tax/i,inv:/發票|invoice/i,note:/備註|note|摘要/i};
function mapRows(rows){if(rows.length<2)return{ok:[],bad:['檔案沒有資料列']};const hd=rows[0].map(x=>String(x||'').trim());const idx={};
 for(const k of['type','cat','co','ym','amt','tax','inv','note']){idx[k]=hd.findIndex((h,i)=>HD[k].test(h)&&!Object.values(idx).includes(i))}
 const miss=['type','co','ym','amt'].filter(k=>idx[k]<0);if(miss.length)return{ok:[],bad:['找不到必要欄位：'+miss.map(k=>({type:'類型',co:'公司',ym:'月份',amt:'金額'}[k])).join('、')+'（目前標題：'+hd.join(' | ')+'）']};
 const ok=[],bad=[];rows.slice(1).forEach((r,i)=>{if(!r.some(x=>x!==''&&x!=null))return;const g=k=>idx[k]>=0?r[idx[k]]:'';const type=normType(g('type')),co=normCo(g('co')),ym=normYM(g('ym')),amt=normAmt(g('amt'));const why=[];if(!type)why.push('類型');if(!co)why.push('公司');if(!ym)why.push('月份');if(amt==null)why.push('金額');
  if(why.length)bad.push(`第 ${i+2} 列：無法辨識 ${why.join('、')}`);else ok.push({id:uid(),type,co,ym,cat:String(g('cat')||'').trim(),amt,tax:normAmt(g('tax')),inv:String(g('inv')||'').trim(),note:String(g('note')||'').trim()})});return{ok,bad}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(f)})}
async function onImpFile(f){const out=$('#impout');if(!f)return;out.innerHTML='讀取中…';try{const buf=await readFile(f);let rows;
 if(/\.csv$/i.test(f.name)){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('big5').decode(buf)}rows=parseCSV(t)}
 else{if(typeof XLSX==='undefined')throw new Error('Excel 讀取元件不可用，請另存為 CSV');const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})}
 const r=mapRows(rows);IMP=r.ok;out.innerHTML=`<div>可匯入 <b>${r.ok.length}</b> 筆；無法辨識 <b>${r.bad.length}</b> 列。</div>${r.bad.length?`<div class="note warn" style="margin-top:8px;max-height:120px;overflow:auto">${r.bad.slice(0,30).map(esc).join('<br>')}${r.bad.length>30?'<br>…':''}</div>`:''}${r.ok.length?`<div style="margin:8px 0;font-size:12px;color:var(--mut)">預覽前 5 筆：${r.ok.slice(0,5).map(e=>`${e.ym} ${e.co} ${TYPES[e.type]} ${fmt(e.amt)}`).join('；')}</div><button class="btn pri" data-act="impgo">確認匯入 ${r.ok.length} 筆</button>`:''}`}catch(e){out.innerHTML=`<div class="note err">讀取失敗：${esc(e.message)}</div>`}}
/* ---------- render ---------- */
function render(keepScroll){const mob=window.innerWidth<=760;const m=mob?document.scrollingElement:$('#main');const sc=m.scrollTop;$('#nav').innerHTML=TABS.map(t=>`<a data-act="tab" data-v="${t[0]}" class="${S.tab===t[0]?'on':''}"><i>${t[2]}</i><span>${t[1]}</span></a>`).join('');
 $('#bar').innerHTML=bar();let h='';try{h=({overview:pageOverview,revenue:pageRevenue,pl:pagePL,ledger:pageLedger,payroll:pagePayroll,invoice:pageInvoice,settings:pageSettings})[S.tab]()}catch(e){h=`<div class="note err">畫面產生錯誤：${esc(e.message)}</div>`;console.error(e)}
 $('#page').innerHTML=h;drawTables();m.scrollTop=keepScroll?sc:0}
/* ---------- events ---------- */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='tab'){S.tab=t.dataset.v;render()}

 else if(a==='tpl')downloadText('匯入範本.csv','類型,公司,月份,類別,金額,稅額,發票號碼,備註\r\n');
 else if(a==='impgo'){if(IMP&&IMP.length){ST.entries=ST.entries.concat(IMP);save();toast('已匯入 '+IMP.length+' 筆');IMP=null;render(1)}}
 else if(a==='bkexp'){downloadText('營收利潤分析備份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'營收利潤分析APP',version:1,exported_at:new Date().toISOString(),entries:ST.entries,settings:ST.settings},null,1),'application/json')}
 else if(a==='clearall'){if(confirm('這會清除所有「手動輸入」的資料（內建資料不受影響）。建議先匯出備份。確定清除？')){ST.entries=[];save();toast('已清除');render(1)}}
 else if(a==='bkgo'){if(BKP){const rep=$('#bkrep').checked;ST.entries=rep?BKP.entries:ST.entries.concat(BKP.entries.filter(n=>!ST.entries.some(o=>o.id===n.id)));if(BKP.settings&&rep){ST.settings=Object.assign(ST.settings,BKP.settings)}save();toast('已還原 '+BKP.entries.length+' 筆');BKP=null;render(1)}}
});
document.addEventListener('change',ev=>{const t=ev.target,a=t.dataset&&t.dataset.act;if(!a)return;
 if(a==='co'){S.co=t.value;render(1)}else if(a==='year'){S.year=t.value;render(1)}
 else if(a==='costsrc'){S.costSrc=t.value;render(1)}
 else if(a==='assign'){ST.settings.assign[t.dataset.k]=t.value;save();toast('已更新歸屬');}
 else if(a==='use401'){ST.settings.use401=t.checked;save();toast(t.checked?'已納入401資料':'已排除401資料')}
 else if(a==='impfile')onImpFile(t.files[0]);
 else if(a==='bkfile'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!Array.isArray(o.entries))throw new Error('格式不符');o.entries.forEach(e=>{if(!e.id)e.id=uid()});BKP=o;$('#bkout').innerHTML=`備份內含 <b>${o.entries.length}</b> 筆。<button class="btn pri sm" data-act="bkgo">確認還原</button>`}catch(e){$('#bkout').innerHTML=`<span class="neg">無法讀取備份：${esc(e.message)}</span>`}})}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset&&t.dataset.act==='tq'){TS[t.dataset.id].q=t.value;drawTable(t.dataset.id)}});
function saveEntry(){const g=i=>$('#'+i).value;const amt=normAmt(g('f_amt')),ym=g('f_ym');if(!ym){toast('請選擇月份');return}if(amt==null){toast('請輸入金額');return}
 const o={id:EDIT||uid(),type:g('f_type'),co:g('f_co'),ym,cat:g('f_cat').trim(),amt,tax:normAmt(g('f_tax')),inv:g('f_inv').trim(),note:g('f_note').trim()};
 if(EDIT){ST.entries=ST.entries.map(e=>e.id===EDIT?o:e);EDIT=null;toast('已更新')}else{ST.entries.push(o);toast('已新增')}save();render(1)}
(function(){const [x,y]=D.ui.brand.split('|');$('#brandA').textContent=x;$('#brandB').textContent=y;document.title=x})();
render();


};

<script>
(function(){
const enc=JSON.parse(document.getElementById('enc').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
const RK='rp_plain_v1';
async function decrypt(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv),additionalData:new TextEncoder().encode(enc.aad)},key,b64(enc.ct));
 return new TextDecoder().decode(pt);
}
function launch(json){window.DATA=JSON.parse(json);$('lock').remove();$('app').hidden=false;window.__start();}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{const r=localStorage.getItem(RK);if(r){launch(r);return}}catch(e){localStorage.removeItem(RK)}
$('lock').hidden=false;
if(!window.crypto||!crypto.subtle){$('err').textContent='此瀏覽器環境不支援加密功能（需要 https 或本機開啟）。'}
async function go(){
 const pw=$('pw').value;if(!pw)return;const b=$('go');b.disabled=true;b.textContent='解密中…';$('err').textContent='';
 try{const json=await decrypt(pw);$('pw').value='';
